<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTSPoofing NVR</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: rgba(10, 12, 16, 0.78);
    --fg: #e6e6e6;
    --muted: #8a8f98;
    --accent: #4ad17a;
    --warn: #ffb454;
    --err: #ff6b6b;
    --dim: #2a2d35;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    image-rendering: optimizeQuality;
    background: #000;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.65));
    color: var(--fg);
    pointer-events: none;
    transition: opacity 180ms ease-out;
    gap: 12px;
    font-size: 18px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { opacity: 0; }
  #overlay .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--dim);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 900ms linear infinite;
  }
  #overlay.warn .spinner { border-top-color: var(--warn); }
  #overlay.err .spinner { border-top-color: var(--err); animation: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlay .sub { color: var(--muted); font-size: 13px; }

  /* Non-covering reconnect indicator. Shown instead of the full overlay
     once we've rendered at least one frame, so the frozen last frame
     stays visible under it. */
  #ribbon {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translate(-50%, -6px);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--fg);
    padding: 7px 14px 7px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.01em;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease-out, transform 220ms ease-out;
    z-index: 8;
    max-width: calc(100vw - 48px);
  }
  #ribbon.show { opacity: 1; transform: translate(-50%, 0); }
  #ribbon .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 0 0 rgba(255, 180, 84, 0.7);
    animation: ribbon-pulse 1400ms ease-out infinite;
  }
  #ribbon.err .pulse { background: var(--err); animation: none; }
  #ribbon .sub { color: var(--muted); margin-left: 4px; }
  @keyframes ribbon-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255, 180, 84, 0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(255, 180, 84, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 180, 84, 0); }
  }

  /* While a reconnect is in flight after we already have a frame, dim
     the canvas slightly so the user feels "this is paused" without
     covering it. */
  canvas.frozen { filter: brightness(0.78) saturate(0.85); transition: filter 240ms ease-out; }

  /* OSD mask — covers the strip the camera's date/time overlay sits in.
     Pure black; positioned by JS so it tracks the canvas's letterboxed
     rect exactly (object-fit: contain leaves bars which the mask must
     not extend into). */
  .osd-mask {
    position: absolute;
    background: #000;
    pointer-events: none;
    z-index: 2;
  }

  #stats {
    position: absolute;
    left: 12px; right: 12px; bottom: 12px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px 18px;
    pointer-events: none;
  }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .kv .k { color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
  .kv .v { color: var(--fg); font-variant-numeric: tabular-nums; }
  .kv .v.good { color: var(--accent); }
  .kv .v.warn { color: var(--warn); }
  .kv .v.err  { color: var(--err); }

  #title {
    position: absolute;
    left: 12px; top: 12px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    background: var(--panel);
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }
  #debug-toggle {
    position: absolute;
    right: 12px; top: 12px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    background: var(--panel);
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    user-select: none;
    z-index: 10;
  }
  #debug-toggle:hover { color: var(--fg); }
  #debug {
    position: absolute;
    right: 12px; top: 48px;
    width: min(520px, calc(100vw - 24px));
    max-height: 45vh;
    overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--fg);
    z-index: 9;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #debug.hidden { display: none; }
  #debug .l-info { color: var(--muted); }
  #debug .l-ok   { color: var(--accent); }
  #debug .l-warn { color: var(--warn); }
  #debug .l-err  { color: var(--err); }
  #debug .ts { color: #4a4e58; margin-right: 6px; }
  #title .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 7px;
    vertical-align: 1px;
    background: var(--muted);
    transition: background 180ms;
  }
  #title.live .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  #title.warn .dot { background: var(--warn); }
  #title.err  .dot { background: var(--err); }
</style>
</head>
<body>
<div id="title"><span class="dot"></span><span id="title-text">starting</span></div>
<div id="debug-toggle" title="toggle diagnostic log">diag</div>
<div id="debug"></div>
<div id="stage">
  <canvas id="canvas" width="640" height="360"></canvas>
  <div id="mask-top" class="osd-mask"></div>
</div>
<div id="ribbon">
  <span class="pulse"></span>
  <span id="ribbon-text">reconnecting</span>
  <span class="sub" id="ribbon-sub"></span>
</div>
<div id="overlay">
  <div class="spinner"></div>
  <div id="overlay-text">connecting to NVR…</div>
  <div class="sub" id="overlay-sub"></div>
</div>
<div id="stats">
  <div class="kv"><span class="k">state</span>  <span class="v" id="k-state">—</span></div>
  <div class="kv"><span class="k">codec</span>  <span class="v" id="k-codec">—</span></div>
  <div class="kv"><span class="k">ssrc</span>   <span class="v" id="k-ssrc">—</span></div>
  <div class="kv"><span class="k">rtp pkts</span><span class="v" id="k-rtp">0</span></div>
  <div class="kv"><span class="k">frames</span> <span class="v" id="k-frames">0</span></div>
  <div class="kv"><span class="k">kbps</span>   <span class="v" id="k-kbps">0</span></div>
  <div class="kv"><span class="k">fps</span>    <span class="v" id="k-fps">0</span></div>
  <div class="kv"><span class="k">keyframes</span><span class="v" id="k-kf">0</span></div>
  <div class="kv"><span class="k">drift</span>  <span class="v" id="k-drift">—</span></div>
  <div class="kv"><span class="k">decoder</span><span class="v" id="k-decoder">—</span></div>
</div>

<script>
"use strict";

const MSG_CONFIG = 0;
const MSG_VIDEO  = 1;
const MSG_STATUS = 2;

const els = {
  canvas:   document.getElementById("canvas"),
  overlay:  document.getElementById("overlay"),
  oText:    document.getElementById("overlay-text"),
  oSub:     document.getElementById("overlay-sub"),
  ribbon:   document.getElementById("ribbon"),
  rText:    document.getElementById("ribbon-text"),
  rSub:     document.getElementById("ribbon-sub"),
  title:    document.getElementById("title"),
  titleTxt: document.getElementById("title-text"),
  k: {
    state:   document.getElementById("k-state"),
    codec:   document.getElementById("k-codec"),
    ssrc:    document.getElementById("k-ssrc"),
    rtp:     document.getElementById("k-rtp"),
    frames:  document.getElementById("k-frames"),
    kbps:    document.getElementById("k-kbps"),
    fps:     document.getElementById("k-fps"),
    kf:      document.getElementById("k-kf"),
    drift:   document.getElementById("k-drift"),
    decoder: document.getElementById("k-decoder"),
  },
};

const ctx = els.canvas.getContext("2d", { alpha: false, desynchronized: true });

// --- Debug log panel ------------------------------------------------------
// Visible under the "diag" button in the top-right. Mirrors to console too.
// The user doesn't need devtools to tell us why decoding is failing — the
// last 200 lines of state transitions, codec probes, and decoder errors
// are right there on the page.

const debugEl = document.getElementById("debug");
const debugToggle = document.getElementById("debug-toggle");

// --- OSD mask (hide camera date/time) ------------------------------------
// Dahua/IMOU cameras overlay a timestamp inside the picture itself —
// there is no way to switch it off from the RTSP side, so the viewer
// permanently blacks out the top strip of the picture. Positioned by JS
// so letterboxing on wide/tall windows doesn't leak the OSD into a
// black-bar region. Height is a fraction of the canvas's rendered height,
// overridable with ?mask-frac=0..0.5 for cameras whose OSD font is bigger.

const maskTop = document.getElementById("mask-top");
const stageEl = document.getElementById("stage");

const MASK_FRAC_DEFAULT = 0.14;
let maskFrac = MASK_FRAC_DEFAULT;
const urlFrac = parseFloat(new URL(location.href).searchParams.get("mask-frac") || "");
if (urlFrac > 0 && urlFrac < 0.5) maskFrac = urlFrac;

function layoutMasks() {
  const cRect = els.canvas.getBoundingClientRect();
  const sRect = stageEl.getBoundingClientRect();
  maskTop.style.left   = (cRect.left - sRect.left) + "px";
  maskTop.style.top    = (cRect.top  - sRect.top)  + "px";
  maskTop.style.width  = cRect.width + "px";
  maskTop.style.height = Math.round(cRect.height * maskFrac) + "px";
}
new ResizeObserver(layoutMasks).observe(els.canvas);
window.addEventListener("resize", layoutMasks);
layoutMasks();

// Open on load for first-run diagnostics; the user can click "diag" to hide.
let debugOpen = true;
const applyDebugVisibility = () => {
  if (debugOpen) debugEl.classList.remove("hidden");
  else           debugEl.classList.add("hidden");
};
applyDebugVisibility();
debugToggle.addEventListener("click", () => { debugOpen = !debugOpen; applyDebugVisibility(); });

const DBG_MAX = 200;
function dlog(level, msg) {
  const ts = new Date().toISOString().slice(11, 23);
  const line = document.createElement("div");
  line.className = "l-" + level;
  line.innerHTML = '<span class="ts">' + ts + "</span>" +
                   msg.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  debugEl.appendChild(line);
  while (debugEl.childNodes.length > DBG_MAX) debugEl.removeChild(debugEl.firstChild);
  debugEl.scrollTop = debugEl.scrollHeight;
  const fn = level === "err" ? "error" : level === "warn" ? "warn" : "log";
  console[fn]("[nvr]", msg);
}
dlog("info", "viewer loaded; user agent: " + navigator.userAgent);

// --- UI helpers -----------------------------------------------------------

function setBadge(mode, text) {
  // mode: "" | "live" | "warn" | "err"
  els.title.className = mode;
  els.titleTxt.textContent = text;
}

function setOverlay(mode, text, sub) {
  // mode: null (hide) | "" (loading) | "warn" | "err"
  if (mode === null) {
    els.overlay.classList.add("hidden");
    return;
  }
  els.overlay.className = mode;
  els.overlay.classList.remove("hidden");
  els.oText.textContent = text || "";
  els.oSub.textContent = sub || "";
}

// Lightweight non-covering reconnect indicator. Used once we already have a
// frame on canvas, so the frozen last frame stays visible under it.
let ribbonHideTimer = null;
function showRibbon(mode, text, sub) {
  if (ribbonHideTimer) { clearTimeout(ribbonHideTimer); ribbonHideTimer = null; }
  els.ribbon.className = (mode === "err" ? "err " : "") + "show";
  els.rText.textContent = text || "";
  els.rSub.textContent = sub ? "· " + sub : "";
  els.canvas.classList.add("frozen");
}
function hideRibbon(delayMs) {
  const run = () => {
    els.ribbon.classList.remove("show");
    els.canvas.classList.remove("frozen");
  };
  if (delayMs && delayMs > 0) {
    if (ribbonHideTimer) clearTimeout(ribbonHideTimer);
    ribbonHideTimer = setTimeout(() => { ribbonHideTimer = null; run(); }, delayMs);
  } else {
    run();
  }
}

function b64decode(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function concat(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

// --- Bitstream helpers -----------------------------------------------------
//
// Chromium's WebCodecs H.264 decoder works most reliably when configured with
// an avcC description and fed length-prefixed NAL units (AVCC format). Annex-B
// mode is spec'd but has had rough edges on Chromium in the past, so we build
// an avcC record from the SDP-advertised SPS/PPS and convert each access unit
// before handing it to decode().

// Build an ISO/IEC 14496-15 § 5.2.4.1 AVCDecoderConfigurationRecord.
function buildAvcC(spsList, ppsList) {
  if (!spsList || spsList.length === 0) return null;
  if (!ppsList || ppsList.length === 0) return null;
  const sps0 = spsList[0];
  if (sps0.length < 4) return null;

  // Fixed header: version(1) + profile(1) + compat(1) + level(1) +
  //               lengthSizeMinusOne(1) + numSPS(1) = 6 bytes.
  let size = 6;
  for (const s of spsList) size += 2 + s.length;
  size += 1;  // numPPS byte
  for (const p of ppsList) size += 2 + p.length;

  const out = new Uint8Array(size);
  let o = 0;
  out[o++] = 1;                     // configurationVersion
  out[o++] = sps0[1];               // AVCProfileIndication
  out[o++] = sps0[2];               // profile_compatibility
  out[o++] = sps0[3];               // AVCLevelIndication
  out[o++] = 0xFF;                  // reserved(6) | lengthSizeMinusOne=3 (4-byte lengths)
  out[o++] = 0xE0 | (spsList.length & 0x1F);
  for (const s of spsList) {
    out[o++] = (s.length >> 8) & 0xFF;
    out[o++] = s.length & 0xFF;
    out.set(s, o); o += s.length;
  }
  out[o++] = ppsList.length & 0xFF;
  for (const p of ppsList) {
    out[o++] = (p.length >> 8) & 0xFF;
    out[o++] = p.length & 0xFF;
    out.set(p, o); o += p.length;
  }
  return out;
}

// Scan an Annex-B access unit and return raw NAL unit byte ranges (no start
// codes). Handles both 3-byte and 4-byte start codes.
function* iterNalUnits(buf) {
  const n = buf.length;
  let i = 0;
  // Advance to first start code.
  let nalStart = -1;
  while (i + 2 < n) {
    if (buf[i] === 0 && buf[i + 1] === 0) {
      if (buf[i + 2] === 1) { nalStart = i + 3; i = nalStart; break; }
      if (i + 3 < n && buf[i + 2] === 0 && buf[i + 3] === 1) {
        nalStart = i + 4; i = nalStart; break;
      }
    }
    i++;
  }
  if (nalStart < 0) return;

  while (i < n) {
    // Find the next start code.
    let next = -1;
    let scLen = 0;
    let j = i;
    while (j + 2 < n) {
      if (buf[j] === 0 && buf[j + 1] === 0) {
        if (buf[j + 2] === 1) { next = j; scLen = 3; break; }
        if (j + 3 < n && buf[j + 2] === 0 && buf[j + 3] === 1) {
          next = j; scLen = 4; break;
        }
      }
      j++;
    }
    if (next < 0) {
      if (n > nalStart) yield buf.subarray(nalStart, n);
      return;
    }
    if (next > nalStart) yield buf.subarray(nalStart, next);
    nalStart = next + scLen;
    i = nalStart;
  }
}

// Annex-B access unit → AVCC: each NAL prefixed by a 4-byte big-endian length.
//
// `opts.stripParamSets` drops H.264 SPS/PPS/AUD/filler NALs when the decoder
// already has them from the avcC description. Chromium otherwise sometimes
// mis-classifies a chunk whose first NAL is SPS as "not a keyframe" and sits
// on it forever waiting for one — this strip + fresh isKey computation is
// what unsticks the "awaiting keyframe" loop in practice.
//
// Returns { data, isKey }. `isKey` is true iff a VCL IDR (type 5) is present.
function annexBToAvcc(au, opts) {
  const stripPS = !!(opts && opts.stripParamSets);
  const nals = [];
  let total = 0;
  let sawIdr = false;
  for (const nal of iterNalUnits(au)) {
    if (nal.length === 0) continue;
    const t = nal[0] & 0x1F;
    if (t === 5) sawIdr = true;
    if (stripPS && (t === 7 || t === 8 || t === 9 || t === 12)) continue;
    nals.push(nal);
    total += 4 + nal.length;
  }
  if (nals.length === 0) return { data: new Uint8Array(0), isKey: sawIdr };
  const out = new Uint8Array(total);
  let o = 0;
  for (const nal of nals) {
    out[o++] = (nal.length >>> 24) & 0xFF;
    out[o++] = (nal.length >>> 16) & 0xFF;
    out[o++] = (nal.length >>> 8)  & 0xFF;
    out[o++] =  nal.length         & 0xFF;
    out.set(nal, o); o += nal.length;
  }
  return { data: out, isKey: sawIdr };
}

// --- Local frame-rate / render-side stats ---------------------------------

const local = {
  renderedFrames: 0,
  renderedWindow: [],  // timestamps of last 2s of rendered frames
  pushFrame() {
    this.renderedFrames++;
    const now = performance.now();
    this.renderedWindow.push(now);
    const cutoff = now - 2000;
    while (this.renderedWindow.length && this.renderedWindow[0] < cutoff) {
      this.renderedWindow.shift();
    }
  },
  renderedFps() {
    if (this.renderedWindow.length < 2) return 0;
    const span = (this.renderedWindow[this.renderedWindow.length - 1] - this.renderedWindow[0]) / 1000;
    return span > 0 ? (this.renderedWindow.length - 1) / span : 0;
  },
};

// --- WebCodecs player ------------------------------------------------------

class Player {
  constructor() {
    this.decoder = null;
    this.currentEpoch = -1;
    this.currentCodec = null;
    this.waitingForKey = true;
    this.chunkTs = 0;             // monotonically increasing synthetic timestamp
    this.useAvcc = false;         // AVCC (length-prefixed) vs Annex-B input
    this.isH264 = false;
    this.isHevc = false;
    this.hasRenderedFrame = false;  // first output() has fired at least once
    this.onFirstFrame = null;       // UI callback, fired exactly once
    this.onEveryFrame = null;       // UI callback, fired on every rendered frame
  }

  // Try a sequence of codec strings until one is `supported` by this browser.
  //
  // Chromium is picky about the profile/level string for H.264 — e.g. a
  // "high 4:4:4 predictive" SPS triplet from a stream the hardware decoder
  // actually accepts via a different profile string can be rejected by
  // isConfigSupported(). We derive one from the SPS and fall back to the
  // common profile strings so hardware-accelerated decoding can still be
  // negotiated when the SPS triplet is odd.
  async pickCodecString(info, description) {
    const candidates = [];
    if (info.codec === "H264") {
      if (info.sps && info.sps.length > 0) {
        const sps = b64decode(info.sps[0]);
        if (sps.length >= 4) {
          const h = (n) => n.toString(16).padStart(2, "0").toUpperCase();
          candidates.push("avc1." + h(sps[1]) + h(sps[2]) + h(sps[3]));
        }
      }
      // Baseline/Main/High @ L3.1 and L4.0 — the common surveillance presets.
      candidates.push("avc1.42E01F", "avc1.42E01E",
                      "avc1.4D401F", "avc1.4D401E",
                      "avc1.64001F", "avc1.640028");
    } else if (info.codec === "H265" || info.codec === "HEVC") {
      candidates.push("hvc1.1.6.L120.90", "hev1.1.6.L120.90",
                      "hvc1.1.6.L93.90",  "hev1.1.6.L93.90",
                      "hvc1.1.6.L150.90", "hev1.1.6.L150.90");
    } else {
      candidates.push("avc1.42E01E");
    }

    const tried = new Set();
    const results = [];
    for (const codec of candidates) {
      if (tried.has(codec)) continue;
      tried.add(codec);
      try {
        const cfg = { codec, optimizeForLatency: true };
        if (description) cfg.description = description;
        const probe = await VideoDecoder.isConfigSupported(cfg);
        results.push(codec + "=" + (probe && probe.supported ? "yes" : "no"));
        if (probe && probe.supported) {
          dlog("ok", "codec probe → " + codec + " supported (" + results.join(", ") + ")");
          return codec;
        }
      } catch (e) {
        results.push(codec + "=throw(" + (e && e.message || e) + ")");
      }
    }
    dlog("err", "no supported H.264/H.265 codec string found: " + results.join(", "));
    dlog("err", "this browser probably lacks the needed decoder — try Chrome stable or Firefox. "
              + "(Chromium on Linux ships without H.264 unless the chromium-codecs-ffmpeg-extra "
              + "package is installed.)");
    // Return the preferred candidate so configure() produces a concrete error.
    return candidates[0];
  }

  async configure(info) {
    this.isH264 = info.codec === "H264";
    this.isHevc = info.codec === "H265" || info.codec === "HEVC";

    // For H.264, build an avcC record and feed AVCC length-prefixed NALs:
    // the most portable WebCodecs path, and the one Chromium handles
    // reliably across versions. For H.265 we stay in Annex-B mode (hvcC
    // is fiddly and HEVC WebCodecs support is uneven anyway).
    let description = null;
    this.useAvcc = false;
    if (this.isH264) {
      const spsList = (info.sps || []).map(b64decode);
      const ppsList = (info.pps || []).map(b64decode);
      const avcc = buildAvcC(spsList, ppsList);
      if (avcc) {
        description = avcc;
        this.useAvcc = true;
      }
    }

    const codec = await this.pickCodecString(info, description);

    if (this.decoder) {
      try { this.decoder.close(); } catch (e) {}
      this.decoder = null;
    }

    this.decoder = new VideoDecoder({
      output: (frame) => {
        if (frame.displayWidth !== els.canvas.width ||
            frame.displayHeight !== els.canvas.height) {
          els.canvas.width = frame.displayWidth;
          els.canvas.height = frame.displayHeight;
        }
        try {
          ctx.drawImage(frame, 0, 0, els.canvas.width, els.canvas.height);
          local.pushFrame();
          this.framesSinceConfig = (this.framesSinceConfig || 0) + 1;
          if (!this.hasRenderedFrame) {
            this.hasRenderedFrame = true;
            dlog("ok", "first frame rendered: "
                     + frame.displayWidth + "x" + frame.displayHeight);
            if (this.onFirstFrame) this.onFirstFrame();
          }
          if (this.onEveryFrame) this.onEveryFrame();
        } catch (e) {
          dlog("err", "drawImage threw: " + (e && e.message || e));
        } finally {
          frame.close();
        }
      },
      error: (e) => {
        dlog("err", "VideoDecoder.onerror: " + (e && e.message || e));
        els.k.decoder.textContent = "error: " + (e && e.message || e);
        els.k.decoder.className = "v err";
        this.waitingForKey = true;
      },
    });

    const cfg = {
      codec,
      optimizeForLatency: true,
      hardwareAcceleration: "prefer-hardware",
    };
    if (description) cfg.description = description;

    dlog("info", "configure: codec=" + codec
                + " avcc=" + this.useAvcc
                + " desc=" + (description ? description.length + "B" : "none")
                + " hw=prefer-hardware");
    try {
      this.decoder.configure(cfg);
    } catch (e) {
      dlog("warn", "configure(prefer-hardware) threw: " + (e && e.message || e)
                 + " — retrying without hardwareAcceleration");
      try {
        delete cfg.hardwareAcceleration;
        this.decoder.configure(cfg);
      } catch (e2) {
        dlog("err", "configure(any) threw: " + (e2 && e2.message || e2));
        setOverlay("err", "decoder configure failed",
                   codec + " — " + (e2 && e2.message || e2));
        els.k.decoder.textContent = "config failed";
        els.k.decoder.className = "v err";
        return;
      }
    }

    this.currentEpoch = info.epoch;
    this.currentCodec = codec;
    this.waitingForKey = true;
    this.chunksSentSinceConfig = 0;
    this.framesSinceConfig = 0;
    this.watchdogWarned = false;

    els.k.codec.textContent = codec + (this.useAvcc ? " · avcC" : " · annex-b");
    els.k.decoder.textContent = "ready";
    els.k.decoder.className = "v good";
    dlog("ok", "decoder ready; waiting for first keyframe");
  }

  decodeAccessUnit(data, isKeyframe) {
    if (!this.decoder) return;
    if (this.decoder.state !== "configured") return;

    // Convert to the decoder's wire format. For AVCC, also:
    //   - strip SPS/PPS/AUD/filler (the decoder has them from the avcC
    //     description; keeping them in-band makes some Chromium builds
    //     mis-classify a key chunk as delta);
    //   - recompute isKey from actual NAL types rather than trusting the
    //     server's flag, so a cached keyframe replay or a mislabelled
    //     chunk still gets `type: "key"` when it should.
    let payload;
    let effectiveKey = isKeyframe;
    if (this.useAvcc) {
      const r = annexBToAvcc(data, { stripParamSets: true });
      payload = r.data;
      effectiveKey = r.isKey || isKeyframe;
    } else {
      payload = data;
    }
    if (payload.length === 0) return;
    if (this.waitingForKey && !effectiveKey) return;
    this.waitingForKey = false;

    try {
      const chunk = new EncodedVideoChunk({
        type: effectiveKey ? "key" : "delta",
        timestamp: this.chunkTs,
        data: payload,
      });
      // 33 ms synthetic step — WebCodecs doesn't act on this value for
      // display, it just has to be monotonically increasing.
      this.chunkTs += 33333;
      this.decoder.decode(chunk);
      this.chunksSentSinceConfig++;
      if (effectiveKey && this.chunksSentSinceConfig <= 2) {
        dlog("ok", "sent " + (effectiveKey ? "KEY" : "delta") + " chunk #"
                 + this.chunksSentSinceConfig + " to decoder (" + payload.length + "B)");
      }
      // Watchdog: 60 chunks in, 0 frames out → decoder is swallowing input.
      // Common cause: Chromium accepted the codec string via isConfigSupported
      // but the underlying ffmpeg decoder can't actually decode this stream.
      if (!this.watchdogWarned
          && this.chunksSentSinceConfig >= 60
          && this.framesSinceConfig === 0) {
        this.watchdogWarned = true;
        dlog("err", "decoder accepted " + this.chunksSentSinceConfig
                   + " chunks but produced 0 frames. "
                   + "Likely the browser lacks a working H.264 decoder. "
                   + "On Linux Chromium, try: apt install chromium-codecs-ffmpeg-extra");
        setOverlay("err", "decoder is swallowing input",
                   "60+ chunks accepted, 0 frames produced — see the diag panel");
      }
    } catch (e) {
      dlog("err", "decode() threw: " + (e && e.message || e));
      this.waitingForKey = true;
    }
  }

  close() {
    if (this.decoder) {
      try { this.decoder.close(); } catch (e) {}
      this.decoder = null;
    }
  }
}

// --- /stream reader --------------------------------------------------------

async function runOnce(player) {
  // Prefer the smooth ribbon over the full overlay once we've ever rendered.
  if (player.hasRenderedFrame) {
    showRibbon("warn", "reconnecting", "connecting to NVR");
  } else {
    setOverlay("", "connecting to NVR…", "");
  }
  setBadge("", "connecting");
  const resp = await fetch("/stream");
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  if (!resp.body) throw new Error("stream has no body");
  const reader = resp.body.getReader();

  if (player.hasRenderedFrame) {
    showRibbon("warn", "awaiting keyframe", "");
  } else {
    setOverlay("", "awaiting keyframe…", "");
  }
  setBadge("warn", "awaiting keyframe");

  // Clear overlay the moment the decoder actually produces a picture — a
  // keyframe arriving on the wire is not enough on its own; the browser
  // may still fail to decode it (unsupported profile, bad SPS). Hooking
  // the output callback is the only reliable signal.
  //
  // Only reset hasRenderedFrame if we've never had a picture; otherwise
  // keep the last frame visible across browser-level fetch reconnects.
  player.onFirstFrame = () => {
    setOverlay(null);
    hideRibbon();
    setBadge("live", "live");
  };
  // After a mid-stream RTSP reconnect, a new frame means "live again".
  // Install a per-frame hook so the ribbon drops immediately once decoding
  // actually resumes, not just when the server says state=streaming.
  player.onEveryFrame = () => {
    if (els.ribbon.classList.contains("show")) {
      hideRibbon();
      setBadge("live", "live");
    }
  };

  let buf = new Uint8Array(0);

  while (true) {
    const { done, value } = await reader.read();
    if (done) throw new Error("stream closed by server");
    buf = concat(buf, value);

    // Parse as many complete framed messages as the buffer holds.
    while (buf.length >= 5) {
      const dv = new DataView(buf.buffer, buf.byteOffset);
      const len = dv.getUint32(0, false);  // length includes the type byte
      if (buf.length < 4 + len) break;
      const type = buf[4];
      const payload = buf.subarray(5, 4 + len);

      if (type === MSG_CONFIG) {
        const info = JSON.parse(new TextDecoder().decode(payload));
        await player.configure(info);
      } else if (type === MSG_VIDEO) {
        if (payload.length >= 2) {
          const isKey = payload[0] === 1;
          const au = payload.subarray(1);
          player.decodeAccessUnit(au, isKey);
        }
      } else if (type === MSG_STATUS) {
        try {
          handleStatus(JSON.parse(new TextDecoder().decode(payload)));
        } catch (e) { /* ignore */ }
      }
      // Advance past the consumed message (copy, since subarray aliases).
      buf = buf.slice(4 + len);
    }
  }
}

function handleStatus(s) {
  if (s.state) {
    els.k.state.textContent = s.state;
    const havePicture = !!(window._player && window._player.hasRenderedFrame);
    if (s.state === "streaming") {
      els.k.state.className = "v good";
      // Delay-hide the ribbon so the "reconnecting" indicator doesn't
      // flicker off before the first new frame actually arrives.
    } else if (s.state === "connecting" || s.state === "reconnecting") {
      els.k.state.className = "v warn";
      setBadge("warn", s.state);
      if (havePicture) {
        // Smooth path: keep the last frame visible, show only a small pill.
        showRibbon("warn", s.state, s.detail || "");
      } else {
        // First connect / never seen a frame — the big overlay is warranted.
        setOverlay("warn", s.state + "…",
                   s.detail || "the NVR is reaching the camera");
      }
    } else if (s.state === "error") {
      els.k.state.className = "v err";
      setBadge("err", "error");
      if (havePicture) {
        showRibbon("err", "error", s.detail || "stream unavailable");
      } else {
        setOverlay("err", "stream unavailable", s.detail || "");
      }
    } else {
      els.k.state.className = "v";
    }
  }
  if (s.ssrc !== undefined)       els.k.ssrc.textContent = s.ssrc;
  if (s.rtp_packets !== undefined) els.k.rtp.textContent = s.rtp_packets.toLocaleString();
  if (s.nalus !== undefined)      els.k.frames.textContent = s.nalus.toLocaleString();
  if (s.kbps !== undefined)       els.k.kbps.textContent = Math.round(s.kbps).toLocaleString();
  if (s.fps !== undefined)        els.k.fps.textContent = s.fps.toFixed(1);
  if (s.keyframes !== undefined)  els.k.kf.textContent = s.keyframes.toLocaleString();
  if (s.drift !== undefined) {
    const d = s.drift;
    els.k.drift.textContent = (d >= 0 ? "+" : "") + d.toFixed(2) + "s";
    els.k.drift.className = Math.abs(d) > 2 ? "v warn" : "v";
  }
}

// --- outer reconnect loop --------------------------------------------------

async function main() {
  if (typeof VideoDecoder === "undefined") {
    dlog("err", "VideoDecoder is undefined — this browser has no WebCodecs API");
    setOverlay("err", "this browser has no WebCodecs API",
               "use Chrome 94+, Edge 94+, Safari 16.4+, or Firefox 130+");
    setBadge("err", "unsupported");
    return;
  }

  // Upfront probe so the "does this browser decode H.264 at all" question is
  // answered before we see any stream — a huge amount of "stuck at awaiting
  // keyframe" turns out to be Chromium builds (incl. Linux distro Chromium)
  // shipping without H.264 support.
  dlog("info", "probing browser codec support…");
  const commonH264 = ["avc1.42E01E", "avc1.42E01F", "avc1.4D401E",
                      "avc1.4D401F", "avc1.64001E", "avc1.640028"];
  let anyH264 = false;
  for (const c of commonH264) {
    try {
      const r = await VideoDecoder.isConfigSupported({ codec: c });
      dlog(r && r.supported ? "ok" : "info", "  " + c + " → " + (r && r.supported ? "supported" : "no"));
      if (r && r.supported) anyH264 = true;
    } catch (e) {
      dlog("warn", "  " + c + " → threw " + (e && e.message || e));
    }
  }
  if (!anyH264) {
    dlog("err", "no H.264 profile is supported by this browser's WebCodecs.");
    dlog("err", "likely cause: Chromium on Linux ships without the proprietary "
              + "H.264 codec. Fix: `sudo apt install chromium-codecs-ffmpeg-extra` "
              + "(Debian/Ubuntu) and restart the browser; or use Google Chrome, "
              + "Firefox 130+, or Edge instead of Chromium.");
    setOverlay("err", "no H.264 decoder in this browser",
               "see diag panel; install chromium-codecs-ffmpeg-extra or use Chrome/Firefox");
    setBadge("err", "no h.264");
    return;
  }
  const h265 = await (async () => {
    try {
      const r = await VideoDecoder.isConfigSupported({ codec: "hvc1.1.6.L120.90" });
      return r && r.supported;
    } catch (e) { return false; }
  })();
  dlog("info", "codec summary: H.264=yes, H.265=" + (h265 ? "yes" : "no"));

  const player = new Player();
  // Expose for handleStatus(); the status handler is a free function and
  // needs to know whether a picture has ever rendered, to pick between the
  // smooth ribbon and the full overlay.
  window._player = player;

  // Local-render FPS tick (independent of server status cadence).
  setInterval(() => {
    const rf = local.renderedFps();
    if (rf > 0) {
      els.k.fps.textContent = rf.toFixed(1);
    }
  }, 500);

  let delay = 500;
  while (true) {
    try {
      await runOnce(player);
    } catch (e) {
      dlog("warn", "stream dropped: " + (e && e.message));
      setBadge("err", "nvr unreachable");
      const sub = "retrying in " + (delay / 1000).toFixed(1) + "s";
      if (player.hasRenderedFrame) {
        showRibbon("err", "NVR unreachable", sub);
      } else {
        setOverlay("err", "NVR unreachable",
                   sub + " — is the NVR process running?");
      }
    }
    await new Promise((r) => setTimeout(r, delay));
    // Exponential backoff capped at 5s so we don't hammer the server.
    delay = Math.min(delay * 2, 5000);
  }
}

main();
</script>
</body>
</html>
