[package]
name = "rtspoofing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rtspoofing"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.38.0", features = ["full"] }
clap  = { version = "=4.4.18", features = ["derive"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["fmt", "env-filter"] }
anyhow = "=1.0.86"

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true
