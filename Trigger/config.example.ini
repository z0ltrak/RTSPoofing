# rtspoof-ctl — presaved args for `rtspoof-ctl spoof`.
# Copy to `config.ini` and edit for your lab.
#
# Relative paths (binary, capture_file) resolve against THIS file's
# directory, so the shipped `../RE/target/release/...` works from
# anywhere.

[proxy]
binary        = ../RE/target/release/rtspoofing

# `inject` replays `capture_file` as the camera stream for the NVR.
mode          = inject

# Upstream camera. For this to actually matter you also need ARP
# spoofing set up (see Trigger/README.md) so the NVR's camera-bound
# traffic lands on this host.
camera_host   = 192.168.1.108
camera_port   = 554

# Where the proxy listens for the NVR. Port 554 needs root (or
# `setcap cap_net_bind_service=+ep` on the binary).
bind          = 0.0.0.0
listen_port   = 554

# The .rtp capture to replay. Record it once with the proxy's own
# `--mode record` run.
capture_file  = ../captured.rtp

# Suppress the real camera stream while the fake one is injected,
# otherwise the NVR gets both overlaid.
inject_only   = true

# Timing: no delay before first frame; 25 fps playback.
inject_delay  = 0.0
inject_fps    = 25

# Chatty-but-not-noisy logs.
log_level     = info

# Optional tcpkill nudge if the NVR holds a live session we need to
# break so it reconnects into the proxy. Leave disabled for the
# ESP32 toggle demo.
# tcpkill_iface = eth0
# tcpkill_delay = 2.0

[runtime]
# State files. The pid file is the source of truth for whether we're
# spoofing; the log file collects the proxy's stdout+stderr so you
# can `rtspoof-ctl logs -f` after the fact.
pid_file      = /tmp/rtspoof-ctl.pid
log_file      = /tmp/rtspoof-ctl.log
