# rtspoof-ctl — presaved args for `rtspoof-ctl spoof`.
# Copy to `config.ini` and edit for your lab.
#
# Relative paths (binary, capture_file) resolve against THIS file's
# directory, so the shipped `../RE/target/release/...` works from
# anywhere.

[proxy]
binary        = ../RE/target/release/rtspoofing

# `inject` replays `capture_file` as the camera stream for the NVR.
mode          = inject

# Upstream camera. For this to actually matter you also need ARP
# spoofing set up (see Trigger/README.md) so the NVR's camera-bound
# traffic lands on this host.
camera_host   = 192.168.1.108
camera_port   = 554

# Where the proxy listens for the NVR. Port 554 needs root (or
# `setcap cap_net_bind_service=+ep` on the binary).
bind          = 0.0.0.0
listen_port   = 554

# The .rtp capture to replay. Record it once with the proxy's own
# `--mode record` run.
capture_file  = ../captured.rtp

# Suppress the real camera stream while the fake one is injected,
# otherwise the NVR gets both overlaid.
inject_only   = true

# Warm-up (seconds) before injection starts. MUST outlast the NVR's RTSP
# handshake (DESCRIBE -> 401 auth -> SETUP -> PLAY): injected $-framed RTP
# shares the RTSP TCP stream, so firing mid-handshake corrupts the response
# and the NVR drops the session ("Malformed RTSP status line"). Do NOT set 0.
# 3.0 is the proxy default and clears a normal LAN handshake with margin.
inject_delay  = 3.0
inject_fps    = 25

# Chatty-but-not-noisy logs.
log_level     = info

# tcpkill — enable for a FAST, deterministic swap. With ARP spoofing up the
# NVR keeps streaming over its existing TCP session (conntrack bypasses the
# PREROUTING redirect for established flows), so it only lands on the proxy
# once that session drops. tcpkill RSTs it so the NVR reconnects straight into
# the proxy. Fires tcpkill_delay seconds after bind — long enough for arpspoof
# to poison and the redirect to be in place. Needs dsniff's tcpkill + tcpdump.
tcpkill_iface = eth0
tcpkill_delay = 1.5

[arpspoof]
# Drives `rtspoof-ctl arpspoof on|off` (and the `attack` one-shot). The
# ESP32's "arpspoof"/"attack" buttons land here. `on` enables
# ip_forward and launches the two arpspoof processes that put this host
# between the NVR and the camera; `off`/`panic` kill them and restore
# ip_forward to whatever it was before.

# Path to arpspoof (dsniff). Leave as the bare name to find it on $PATH.
binary        = arpspoof

# NIC on the camera LAN.
iface         = eth0

# The two victims. The NVR is the recorder pulling the stream; the
# camera is the real device whose feed we sit in front of. Must match
# [proxy].camera_host for the inject to actually reach the NVR.
nvr_ip        = 192.168.1.10
camera_ip     = 192.168.1.108

[runtime]
# State files. The pid file is the source of truth for whether we're
# spoofing; the log file collects the proxy's stdout+stderr so you
# can `rtspoof-ctl logs -f` after the fact.
pid_file      = /tmp/rtspoof-ctl.pid
log_file      = /tmp/rtspoof-ctl.log

# arpspoof runs as a pair of processes; both PIDs live here (one per
# line). A sibling `/tmp/rtspoof-arp.ipfwd` remembers ip_forward's
# pre-attack value so `panic` puts it back exactly as it was.
arp_pid_file  = /tmp/rtspoof-arp.pid
